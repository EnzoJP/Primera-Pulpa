<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Formulario</title>
</head>
<body>
<h1 th:text="${formTitle}">Formulario</h1>
<p th:if="${error}" th:text="${error}"></p>
<form th:object="${item}" th:action="${formAction}" method="post">
    <div>
        <label for="descripcion">Descripción</label>
        <input id="descripcion" type="text" th:field="*{descripcion}" placeholder="ej: kg, litros, unidades" required>
    </div>
    <button type="submit">Guardar</button>
</form>
<p><a th:href="${basePath}">Volver</a></p>
</body>
</html>
