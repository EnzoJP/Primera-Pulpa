<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="topbar"
        class="flex justify-between items-center w-full px-4 sm:px-md h-16 sticky top-0 z-30 shadow-sm dark:shadow-none bg-surface dark:bg-surface-dim border-b border-outline-variant/10">
    <div class="md:hidden flex items-center gap-sm">
        <button id="btn-sidebar-toggle"
                type="button"
                class="text-on-surface p-2 rounded-full hover:bg-surface-container-highest transition-colors cursor-pointer"
                title="Abrir menú">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Primera Pulpa</span>
    </div>

    <div class="hidden md:flex items-center gap-sm flex-1">
        <span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Primera Pulpa</span>
    </div>

    <div class="flex items-center gap-sm">

        <a th:href="@{/perfil}" class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant ml-sm cursor-pointer bg-surface-variant flex items-center justify-center hover:opacity-80 transition-opacity" title="Mi Perfil">
            <span class="material-symbols-outlined text-on-surface-variant text-[20px]">person</span>

</html>
