<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Formulario</title>
</head>
<body>
<h1 th:text="${formTitle}">Formulario</h1>
<p th:if="${error}" th:text="${error}"></p>
<form th:object="${item}" th:action="${formAction}" method="post">
    <div>
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" th:field="*{nombre}" required>
    </div>
    <div>
        <label for="precioVenta">Precio de venta</label>
        <input id="precioVenta" type="number" step="0.01" min="0" th:field="*{precioVenta}">
    </div>
    <div>Costo (por kg): <span th:text="${item.costo}">0</span></div>
    <div>Ganancia estimada: <span id="ganancia">-</span></div>
    <button type="submit">Guardar</button>
</form>
<p><a th:href="${basePath}">Volver</a></p>
<script>
    const costo = /*[[${item.costo}]]*/ 0;
    const input = document.getElementById('precioVenta');
    const ganancia = document.getElementById('ganancia');
    function actualizarGanancia() {
        const p = parseFloat(input.value);
        if (isNaN(p)) {
            ganancia.textContent = '-';
            return;
        }
        ganancia.textContent = (p - costo).toFixed(2);
    }
    input.addEventListener('input', actualizarGanancia);
    actualizarGanancia();
</script>
</body>
</html>
