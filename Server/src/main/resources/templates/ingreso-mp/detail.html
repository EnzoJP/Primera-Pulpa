<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: layout('Detalle de Ingreso MP - Primera Pulpa', 'ingresos-mp', ~{::#ingreso-detail-content})}">
<body>

<div id="ingreso-detail-content" class="space-y-md">

    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-base pb-sm border-b border-outline-variant/20">
        <div>
            <div class="flex items-center gap-xs text-on-surface-variant font-label-caps text-label-caps uppercase mb-1">
                <span class="material-symbols-outlined text-[18px]">move_to_inbox</span>
                <span>Comprobante de Ingreso</span>
            </div>
            <h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">
                Ingreso <span class="font-data-tabular" th:text="'#' + ${ingreso.id}">#1</span>
            </h1>
            <p class="font-body-sm text-body-sm text-on-surface-variant"
               th:text="'Registrado el ' + ${#temporals.format(ingreso.fechaHora, 'dd/MM/yyyy')} + ' a las ' + ${#temporals.format(ingreso.fechaHora, 'HH:mm')} + ' hs'">Fecha</p>
        </div>

        <a th:href="@{/ingresos-mp}"
           class="inline-flex items-center justify-center gap-xs px-md py-sm bg-surface-container text-on-surface font-label-caps text-label-caps rounded-lg hover:bg-surface-container-highest transition-colors">
            <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            <span>Volver al Listado</span>
        </a>
    </header>

    <!-- Tabla de Detalles -->
    <div class="bg-surface-container-lowest rounded-xl soft-shadow border border-outline-variant/20 overflow-hidden">
        <div class="overflow-x-auto custom-scrollbar">
            <table class="w-full text-left border-collapse">
                <thead class="bg-surface-container border-b border-outline-variant/20 text-on-surface-variant font-label-caps text-label-caps">
                <tr>
                    <th class="py-3 px-4 font-normal w-auto">Materia Prima</th>
                    <th class="py-3 px-4 font-normal w-36 text-center">Unidad</th>
                    <th class="py-3 px-4 font-normal w-40 text-right">Cantidad</th>
                    <th class="py-3 px-4 font-normal w-44 text-center">Vencimiento</th>
                    <th class="py-3 px-4 font-normal w-44 text-right">Restante (FIFO)</th>
                </tr>
                </thead>

                <tbody class="font-body-sm text-body-sm text-on-surface divide-y divide-outline-variant/10">
                <tr th:each="det : ${ingreso.detalles}" class="hover:bg-surface-container-low transition-colors">
                    <!-- Materia Prima -->
                    <td class="py-3.5 px-4 font-medium text-primary">
                        <div class="flex items-center gap-2 truncate">
                            <span class="material-symbols-outlined text-outline text-[20px] flex-shrink-0">spa</span>
                            <span class="truncate" th:text="${det.materiaPrima?.nombre}">Materia Prima</span>
                        </div>
                    </td>

                    <!-- Unidad -->
                    <td class="py-3.5 px-4 text-center font-label-caps text-on-surface-variant">
                        <span class="inline-block px-2.5 py-0.5 rounded bg-surface-container text-xs font-semibold"
                              th:text="${det.materiaPrima?.unidadMedida?.descripcion ?: 'kg'}">kg</span>
                    </td>

                    <!-- Cantidad -->
                    <td class="py-3.5 px-4 text-right font-data-tabular text-data-tabular font-medium text-on-surface"
                        th:text="${det.cantidad}">0</td>

                    <!-- Vencimiento -->
                    <td class="py-3.5 px-4 text-center font-data-tabular text-data-tabular text-on-surface-variant"
                        th:text="${det.fechaVencimiento != null ? #temporals.format(det.fechaVencimiento, 'dd/MM/yyyy') : '—'}">—</td>

                    <!-- Restante (desglose FIFO) -->
                    <td class="py-3.5 px-4 text-right font-data-tabular text-data-tabular">
                        <span th:if="${det.restante <= 0}"
                              class="inline-flex items-center justify-end gap-1 font-bold text-error">
                            <span class="material-symbols-outlined text-[15px]">block</span>
                            Agotado
                        </span>
                        <span th:if="${det.restante > 0 and det.cantidadRestante != null}"
                              class="font-medium text-primary"
                              th:text="${#numbers.formatDecimal(det.restante, 1, 'POINT', 2, 'COMMA')}">0,00</span>
                        <span th:if="${det.cantidadRestante == null}"
                              class="font-medium text-on-surface-variant"
                              th:text="${#numbers.formatDecimal(det.restante, 1, 'POINT', 2, 'COMMA')} + ' (íntegro)'">0,00 (íntegro)</span>
                    </td>
                </tr>
                </tbody>

                <!-- Total -->
                <tfoot>
                <tr class="bg-surface-container-low border-t-2 border-outline-variant/30">
                    <td colspan="4" class="py-4 px-4 text-right font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">
                        Cantidad Total del Ingreso:
                    </td>
                    <td class="py-4 px-4 pr-6 text-right font-data-tabular text-body-lg font-bold text-primary">
                        <span th:text="${#numbers.formatDecimal(ingreso.detalles.stream().mapToDouble(d -> d.cantidad).sum(), 1, 'POINT', 2, 'COMMA')}">0,00</span>
                    </td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

</body>
</html>
