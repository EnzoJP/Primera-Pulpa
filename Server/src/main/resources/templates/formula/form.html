<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Formulario</title>
</head>
<body>
<h1 th:text="${formTitle}">Formulario</h1>
<p th:if="${error}" th:text="${error}"></p>
<form th:object="${item}" th:action="${formAction}" method="post">
    <div>
        <label for="mix">Mix</label>
        <select id="mix" name="mix" required>
            <option value="">Seleccionar...</option>
            <option th:each="m : ${mixes}" th:value="${m.id}"
                    th:selected="${item.mix != null and item.mix.id == m.id}"
                    th:text="${m.nombre}">Mix</option>
        </select>
    </div>
    <div>
        <label for="cantidad">Cantidad que produce (kg)</label>
        <input id="cantidad" type="number" step="0.01" min="0.01" th:field="*{cantidad}" required>
    </div>
    <h2>Materias primas (gramos)</h2>
    <table border="1" cellpadding="6">
        <thead>
        <tr>
            <th>Materia prima</th>
            <th>Unidad</th>
            <th>Gramos</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d, st : ${item.detalles}">
            <td th:text="${d.materiaPrima.nombre}">Materia prima</td>
            <td th:text="${d.materiaPrima.unidadMedida?.descripcion}">kg</td>
            <td>
                <input type="hidden" th:name="'detalles[' + ${st.index} + '].id'" th:value="${d.id}">
                <input type="hidden" th:name="'detalles[' + ${st.index} + '].materiaPrima'" th:value="${d.materiaPrima.id}">
                <input type="number" step="0.01" min="0" th:field="*{detalles[__${st.index}__].gramos}">
            </td>
        </tr>
        </tbody>
    </table>
    <button type="submit">Guardar</button>
</form>
<p><a th:href="${basePath}">Volver</a></p>
</body>
</html>
