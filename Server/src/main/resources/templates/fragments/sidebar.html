<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(activePage)"
       class="hidden md:flex flex-col h-full py-md px-sm border-r border-outline-variant/20 bg-surface-container dark:bg-surface-container-low fixed left-0 w-64 z-40 transition-all duration-300">

    <div class="flex items-center gap-sm px-sm mb-lg">
        <div class="w-10 h-10 rounded-lg overflow-hidden bg-primary-container flex items-center justify-center text-on-primary-container">
            <span class="material-symbols-outlined text-on-primary text-[32px] fill">eco</span>
        </div>
        <div>
            <h1 class="font-headline-md text-headline-md text-primary">Primera Pulpa</h1>
            <p class="font-body-sm text-body-sm text-on-surface-variant">Control de stock</p>
        </div>
    </div>

    <a th:href="@{/lotes/nuevo}"
       class="bg-primary text-on-primary font-label-caps text-label-caps py-sm px-md rounded-lg mb-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
        <span class="material-symbols-outlined">add</span>
        Nuevo Lote
    </a>

    <nav class="flex-1 flex flex-col gap-xs">
        <a th:href="@{/dashboard}"
           th:class="${activePage == 'dashboard'} ?
                     'flex items-center gap-md px-md py-sm bg-secondary-container text-on-secondary-container rounded-lg font-bold group' :
                     'flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-surface-container-highest rounded-lg transition-all group'">
            <span class="material-symbols-outlined group-hover:scale-110 transition-transform">dashboard</span>
            <span class="font-label-caps text-label-caps">Dashboard</span>
        </a>

        <a th:href="@{/materias-primas}"
           th:class="${activePage == 'materias-primas'} ?
                     'flex items-center gap-md px-md py-sm bg-secondary-container text-on-secondary-container rounded-lg font-bold group' :
                     'flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-surface-container-highest rounded-lg transition-all group'">
            <span class="material-symbols-outlined group-hover:scale-110 transition-transform">spa</span>
            <span class="font-label-caps text-label-caps">Materia Prima</span>
        </a>
        <a th:href="@{/mixes}"
           th:class="${activePage == 'mixes'} ?
                     'flex items-center gap-md px-md py-sm bg-secondary-container text-on-secondary-container rounded-lg font-bold group' :
                     'flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-surface-container-highest rounded-lg transition-all group'">
            <span class="material-symbols-outlined group-hover:scale-110 transition-transform">inventory_2</span>
            <span class="font-label-caps text-label-caps">Catálogo Mixes</span>
        </a>

        <a th:href="@{/formulas}"
           th:class="${activePage == 'formulas'} ?
                     'flex items-center gap-md px-md py-sm bg-secondary-container text-on-secondary-container rounded-lg font-bold group' :
                     'flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-surface-container-highest rounded-lg transition-all group'">
            <span class="material-symbols-outlined group-hover:scale-110 transition-transform">science</span>
            <span class="font-label-caps text-label-caps">Formulas</span>
        </a>

        <a th:href="@{/alertas}"
           th:class="${activePage == 'alertas'} ?
                     'flex items-center gap-md px-md py-sm bg-secondary-container text-on-secondary-container rounded-lg font-bold group' :
                     'flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-surface-container-highest rounded-lg transition-all group'">
            <span class="material-symbols-outlined group-hover:scale-110 transition-transform">warning</span>
            <span class="font-label-caps text-label-caps">Panel Alertas</span>
        </a>
    </nav>
    <a th:href="@{/unidades-medida}"
       th:class="${activeMenu == 'unidades-medida'} ?
             'flex items-center gap-xs px-md py-2 rounded-lg bg-primary text-on-primary font-label-caps text-label-caps soft-shadow transition-all' :
             'flex items-center gap-xs px-md py-2 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-primary font-label-caps text-label-caps transition-all'">
        <span class="material-symbols-outlined text-[20px]">straighten</span>
        <span>Unidades de Medida</span>
    </a>

    <a th:href="@{/costos-adicionales}"
       th:class="${activeMenu == 'costos-adicionales'} ?
             'flex items-center gap-xs px-md py-2 rounded-lg bg-primary text-on-primary font-label-caps text-label-caps soft-shadow transition-all' :
             'flex items-center gap-xs px-md py-2 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-primary font-label-caps text-label-caps transition-all'">
        <span class="material-symbols-outlined text-[20px]">price_change</span>
        <span>Costos Adicionales</span>
    </a>

    <a th:href="@{/usuarios}"
       th:class="${activeMenu == 'usuarios'} ?
             'flex items-center gap-xs px-md py-2 rounded-lg bg-primary text-on-primary font-label-caps text-label-caps soft-shadow transition-all' :
             'flex items-center gap-xs px-md py-2 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-primary font-label-caps text-label-caps transition-all'">
        <span class="material-symbols-outlined text-[20px]">manage_accounts</span>
        <span>Usuarios</span>
    </a>

    <div class="mt-auto flex flex-col gap-xs pt-md border-t border-outline-variant/30">
        <a th:href="@{/ayuda}" class="flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-surface-container-highest rounded-lg transition-all group">
            <span class="material-symbols-outlined group-hover:scale-110 transition-transform">help</span>
            <span class="font-label-caps text-label-caps">Ayuda</span>
        </a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="w-full flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-error-container/30 hover:text-error rounded-lg transition-all group">
                <span class="material-symbols-outlined group-hover:scale-110 transition-transform">logout</span>
                <span class="font-label-caps text-label-caps">Cerrar Sesión</span>
            </button>
        </form>
    </div>
</aside>

</body>
</html>
