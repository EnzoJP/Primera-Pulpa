<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="topbar"
        class="flex justify-between items-center w-full px-md h-16 sticky top-0 z-30 shadow-sm dark:shadow-none bg-surface dark:bg-surface-dim border-b border-outline-variant/10">
    <div class="md:hidden flex items-center gap-sm">
        <button class="text-on-surface p-2 rounded-full hover:bg-surface-container-highest transition-colors">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Primera Pulpa</span>
    </div>

    <div class="hidden md:flex items-center gap-sm flex-1">
        <span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Primera Pulpa</span>
    </div>

    <div class="flex items-center gap-sm">
        <button class="p-2 text-primary dark:text-primary-fixed hover:bg-surface-container-high transition-colors rounded-full opacity-80 hover:opacity-100 duration-150 relative">
            <span class="material-symbols-outlined">notifications</span>
            <span class="absolute top-2 right-2 w-2 h-2 bg-error rounded-full"></span>
        </button>
        <button class="p-2 text-primary dark:text-primary-fixed hover:bg-surface-container-high transition-colors rounded-full opacity-80 hover:opacity-100 duration-150">
            <span class="material-symbols-outlined">settings</span>
        </button>
        <div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant ml-sm cursor-pointer bg-surface-variant flex items-center justify-center">
            <span class="material-symbols-outlined text-on-surface-variant text-[20px]">person</span>
        </div>
    </div>
</header>

</body>
</html>
