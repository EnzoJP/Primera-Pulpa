<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: layout('Detalle de ' + ${entityName} + ' - Primera Pulpa', ${activeMenu ?: 'dashboard'}, ~{::#detail-content})}">
<body>

<div id="detail-content" class="max-w-4xl mx-auto space-y-md">

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-base pb-sm border-b border-outline-variant/20">
        <div>
            <a th:href="@{|${basePath}|}"
               class="inline-flex items-center gap-xs font-label-caps text-label-caps text-on-surface-variant hover:text-primary mb-2 transition-colors">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                <span>Volver al listado</span>
            </a>
            <div class="flex items-center gap-sm">
                <h1 class="font-headline-lg text-headline-lg text-primary tracking-tight" th:text="'Detalle de ' + ${entityName}">Detalle de Entidad</h1>
                <span class="font-data-tabular text-data-tabular px-2.5 py-0.5 rounded-full bg-surface-container text-on-surface-variant border border-outline-variant/30 text-xs font-medium"
                      th:if="${item.id != null}"
                      th:text="'#' + ${item.id}">#1</span>
            </div>
            <p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Información completa y atributos registrados en el sistema.</p>
        </div>

        <div class="flex items-center gap-xs">
            <a th:href="@{|${basePath}/${item.id}/editar|}"
               class="inline-flex items-center gap-xs px-md py-2 bg-primary text-on-primary font-label-caps text-label-caps rounded-lg soft-shadow hover:opacity-90 transition-opacity">
                <span class="material-symbols-outlined text-[18px]">edit</span>
                <span>Editar</span>
            </a>
            <form th:action="@{|${basePath}/${item.id}/eliminar|}"
                  method="post"
                  class="inline m-0"
                  onsubmit="return confirm('¿Está seguro de eliminar este registro?');">
                <button type="submit"
                        class="p-2 text-on-surface-variant hover:text-error hover:bg-error-container/30 rounded-lg transition-colors"
                        title="Eliminar">
                    <span class="material-symbols-outlined text-[20px]">delete</span>
                </button>
            </form>
        </div>
    </div>

    <div class="bg-surface-container-lowest rounded-xl soft-shadow border border-outline-variant/20 overflow-hidden">
        <div class="p-md bg-surface-container/40 border-b border-outline-variant/20 flex items-center justify-between">
            <h2 class="font-headline-md text-headline-md text-primary">Propiedades del Registro</h2>
            <span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider text-xs">Atributos Generales</span>
        </div>

        <div class="p-md md:p-lg">
            <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-lg gap-y-md">

                <div th:each="field : ${fields}" class="border-b border-outline-variant/10 pb-3">

                    <dt class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider mb-1"
                        th:text="${field}">
                        Campo
                    </dt>

                    <dd class="font-body-md text-body-md text-on-surface">
                        <span th:if="${item[field] instanceof T(java.lang.Boolean)}"
                              th:class="${!item[field]} ? 'inline-flex items-center px-2 py-0.5 rounded-full font-label-caps text-label-caps bg-secondary-container text-on-secondary-container' : 'inline-flex items-center px-2 py-0.5 rounded-full font-label-caps text-label-caps bg-error-container text-on-error-container'"
                              th:text="${!item[field] ? 'Activo' : 'Inactivo'}">
                        </span>

                        <span th:if="${item[field] instanceof T(java.lang.Number)}"
                              class="font-data-tabular text-data-tabular"
                              th:text="${item[field]}">
                            0
                        </span>

                        <span th:unless="${item[field] instanceof T(java.lang.Boolean) or item[field] instanceof T(java.lang.Number)}"
                              th:text="${item[field] != null ? item[field] : '—'}">
                            Valor
                        </span>
                    </dd>
                </div>

            </dl>
        </div>
    </div>

</div>

</body>
</html>
