<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: layout('Detalle de ' + ${item.nombre} + ' - Primera Pulpa', 'usuarios', ~{::#usuario-detail-content})}">
<body>

<div id="usuario-detail-content" class="max-w-3xl mx-auto space-y-md">

    <div class="pb-sm border-b border-outline-variant/20">
        <a th:href="@{|${basePath}|}"
           class="inline-flex items-center gap-xs font-label-caps text-label-caps text-on-surface-variant hover:text-primary mb-2 transition-colors">
            <span class="material-symbols-outlined text-[18px]">arrow_back</span>
            <span>Volver al listado</span>
        </a>
        <div class="flex items-center justify-between gap-sm">
            <h1 class="font-headline-lg text-headline-lg text-primary tracking-tight" th:text="${item.nombre}">
                Nombre del Usuario
            </h1>
            <span class="inline-block px-2.5 py-1 rounded text-xs font-semibold font-label-caps"
                  th:classappend="${item.rol != null and item.rol.descripcion == 'ADMIN'} ? 'bg-primary-container text-on-primary-container' : 'bg-surface-container text-on-surface-variant'"
                  th:text="${item.rol != null ? item.rol.descripcion : 'SIN ROL'}">ADMIN</span>
        </div>
        <p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Información detallada de la cuenta de usuario.</p>
    </div>

    <div class="bg-surface-container-lowest rounded-xl soft-shadow border border-outline-variant/20 p-lg space-y-md">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
            <div class="space-y-1">
                <span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">ID de Usuario</span>
                <p class="font-data-tabular text-body-md text-primary font-bold" th:text="'#' + ${item.id}">#1</p>
            </div>
            <div class="space-y-1">
                <span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Estado de la Cuenta</span>
                <p>
                    <span class="inline-block px-2.5 py-0.5 rounded text-xs font-semibold font-label-caps"
                          th:classappend="${item.eliminado == true} ? 'bg-error-container text-on-error-container' : 'bg-secondary-container text-on-secondary-container'"
                          th:text="${item.eliminado == true ? 'Inactivo (Desactivado)' : 'Activo'}">Activo</span>
                </p>
            </div>
            <div class="space-y-1">
                <span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Nombre Completo</span>
                <p class="font-body-md text-body-md text-on-surface" th:text="${item.nombre}">Juan Perez</p>
            </div>
            <div class="space-y-1">
                <span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Correo Electrónico</span>
                <p class="font-body-md text-body-md text-on-surface font-data-tabular" th:text="${item.email}">juan@ejemplo.com</p>
            </div>
        </div>

        <div class="flex items-center justify-end gap-sm pt-md border-t border-outline-variant/20">
            <a th:href="@{|${basePath}|}"
               class="px-md py-2.5 text-on-surface-variant font-label-caps text-label-caps hover:bg-surface-container rounded-lg transition-colors">
                Volver
            </a>
            <a th:href="@{|${basePath}/${item.id}/editar|}"
               class="inline-flex items-center gap-xs px-md py-2.5 bg-primary text-on-primary font-label-caps text-label-caps rounded-lg soft-shadow hover:opacity-90 transition-opacity">
                <span class="material-symbols-outlined text-[18px]">edit</span>
                <span>Editar Usuario</span>
            </a>
        </div>
    </div>
</div>

</body>
</html>
