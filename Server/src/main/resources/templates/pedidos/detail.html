<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: layout('Detalle de Pedido - Primera Pulpa', 'pedidos', ~{::#pedido-detail-content})}">
<body>

<div id="pedido-detail-content" class="space-y-md">

    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-base pb-sm border-b border-outline-variant/20">
        <div>
            <div class="flex items-center gap-xs text-on-surface-variant font-label-caps text-label-caps uppercase mb-1">
                <span class="material-symbols-outlined text-[18px]">shopping_cart</span>
                <span>Comprobante de Pedido</span>
            </div>
            <h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">
                Pedido <span class="font-data-tabular" th:text="'#' + ${pedido.id}">#1</span>
            </h1>
            <p class="font-body-sm text-body-sm text-on-surface-variant"
               th:text="'Registrado el ' + ${#temporals.format(pedido.fecha, 'dd/MM/yyyy')} + ' por ' + (${pedido.usuario?.nombre} ?: '—')">Fecha</p>
        </div>

        <a th:href="@{/pedidos}"
           class="inline-flex items-center justify-center gap-xs px-md py-sm bg-surface-container text-on-surface font-label-caps text-label-caps rounded-lg hover:bg-surface-container-highest transition-colors">
            <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            <span>Volver al Listado</span>
        </a>
    </header>

    <!-- Info del Pedido -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-md">
        <div class="bg-surface-container-lowest rounded-xl soft-shadow border border-outline-variant/20 p-md">
            <span class="block font-label-caps text-label-caps text-on-surface-variant uppercase">Cliente</span>
            <div class="flex items-center gap-2 mt-1">
                <span class="material-symbols-outlined text-primary text-[20px]">storefront</span>
                <span class="font-body-md text-body-md font-medium text-primary" th:text="${pedido.cliente?.nombre ?: '—'}">Cliente</span>
            </div>
            <span class="block font-body-sm text-xs text-on-surface-variant mt-0.5" th:text="'Contacto: ' + (${pedido.cliente?.contacto} ?: '—')">Contacto</span>
        </div>

        <div class="bg-surface-container-lowest rounded-xl soft-shadow border border-outline-variant/20 p-md">
            <span class="block font-label-caps text-label-caps text-on-surface-variant uppercase">Estado</span>
            <div class="mt-1">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-[12px] font-label-caps uppercase tracking-wider font-semibold"
                      th:classappend="${pedido.estadoPedido?.descripcion == 'PENDIENTE'} ? 'bg-amber-100 text-amber-800' : (${pedido.estadoPedido?.descripcion == 'PREPARADO'} ? 'bg-blue-100 text-blue-800' : (${pedido.estadoPedido?.descripcion == 'ENTREGADO'} ? 'bg-secondary-container text-on-secondary-container' : 'bg-error-container/40 text-on-error-container'))"
                      th:text="${pedido.estadoPedido?.descripcion ?: '—'}">PENDIENTE</span>
            </div>
        </div>

        <div class="bg-surface-container-lowest rounded-xl soft-shadow border border-outline-variant/20 p-md">
            <span class="block font-label-caps text-label-caps text-on-surface-variant uppercase">Total del Pedido</span>
            <div class="flex items-baseline gap-1 mt-1">
                <span class="text-on-surface-variant text-xs">$</span>
                <span class="font-data-tabular text-headline-md text-primary font-bold"
                      th:text="${#numbers.formatDecimal(totalPedido, 1, 'POINT', 2, 'COMMA')}">0,00</span>
            </div>
        </div>
    </div>

    <!-- Tabla de Detalles -->
    <div class="bg-surface-container-lowest rounded-xl soft-shadow border border-outline-variant/20 overflow-hidden">
        <div class="p-md border-b border-outline-variant/20 bg-surface-container-low">
            <h3 class="font-headline-md text-headline-md text-primary">Mixes Despachados</h3>
        </div>

        <div class="overflow-x-auto custom-scrollbar">
            <table class="w-full text-left border-collapse">
                <thead class="bg-surface-container border-b border-outline-variant/20 text-on-surface-variant font-label-caps text-label-caps">
                <tr>
                    <th class="py-3 px-4 font-normal w-auto">Mix</th>
                    <th class="py-3 px-4 font-normal w-40 text-right">Cantidad (kg)</th>
                    <th class="py-3 px-4 font-normal w-40 text-right">Precio Unitario</th>
                    <th class="py-3 px-4 font-normal w-40 text-right">Subtotal</th>
                </tr>
                </thead>

                <tbody class="font-body-sm text-body-sm text-on-surface divide-y divide-outline-variant/10">
                <tr th:each="det : ${detalles}" class="hover:bg-surface-container-low transition-colors">
                    <td class="py-3.5 px-4 font-medium text-primary">
                        <div class="flex items-center gap-2 truncate">
                            <span class="material-symbols-outlined text-outline text-[20px] flex-shrink-0">inventory_2</span>
                            <span class="truncate" th:text="${det.mix?.nombre}">Mix</span>
                        </div>
                    </td>
                    <td class="py-3.5 px-4 text-right font-data-tabular text-data-tabular font-medium text-on-surface">
                        <span th:text="${#numbers.formatDecimal(det.cantidad, 1, 'POINT', 2, 'COMMA')}">0,00</span>
                        <span class="text-xs text-on-surface-variant ml-0.5">kg</span>
                    </td>
                    <td class="py-3.5 px-4 text-right font-data-tabular text-data-tabular text-on-surface-variant">
                        <span class="text-xs mr-0.5">$</span>
                        <span th:text="${#numbers.formatDecimal(det.precioUnitario, 1, 'POINT', 2, 'COMMA')}">0,00</span>
                        <span class="text-xs ml-0.5">/ kg</span>
                    </td>
                    <td class="py-3.5 px-4 text-right font-data-tabular text-data-tabular font-bold text-on-surface">
                        <span class="text-xs mr-0.5">$</span>
                        <span th:text="${#numbers.formatDecimal(det.cantidad * det.precioUnitario, 1, 'POINT', 2, 'COMMA')}">0,00</span>
                    </td>
                </tr>
                </tbody>

                <!-- Total -->
                <tfoot>
                <tr class="bg-surface-container-low border-t-2 border-outline-variant/30">
                    <td colspan="3" class="py-4 px-4 text-right font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">
                        Total del Pedido:
                    </td>
                    <td class="py-4 px-4 pr-6 text-right font-data-tabular text-body-lg font-bold text-primary">
                        <span class="text-sm">$</span>
                        <span th:text="${#numbers.formatDecimal(totalPedido, 1, 'POINT', 2, 'COMMA')}">0,00</span>
                    </td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

</body>
</html>
