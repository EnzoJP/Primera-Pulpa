<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(titulo, activePage, contenido)">

<head th:replace="~{fragments/head :: head(titulo=${titulo})}"></head>

<body class="bg-background text-on-background font-body-md min-h-screen antialiased flex flex-col relative overflow-x-hidden">

<!-- Backdrop móvil (oscurece la pantalla al abrir el sidebar) -->
<div id="sidebar-backdrop"
     class="fixed inset-0 bg-black/50 backdrop-blur-xs z-40 hidden md:hidden transition-opacity duration-300 opacity-0"></div>

<!-- Sidebar Fragment -->
<aside th:replace="~{fragments/sidebar :: sidebar(activePage=${activePage})}"></aside>

<!-- Contenedor Principal  -->
<div class="flex-1 flex flex-col w-full md:pl-64 transition-all duration-300 min-w-0">

    <!-- Topbar Fragment -->
    <header th:replace="~{fragments/topbar :: topbar}"></header>

    <!-- Contenido Central Dinámico -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
        <div th:replace="${contenido}"></div>
    </main>
</div>

<!-- Script de control del Sidebar Móvil -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sidebar = document.getElementById('app-sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        const btnToggle = document.getElementById('btn-sidebar-toggle');
        const btnClose = document.getElementById('btn-sidebar-close');

        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            backdrop.classList.remove('hidden');
            setTimeout(() => backdrop.classList.add('opacity-100'), 10);
            document.body.classList.add('overflow-hidden', 'md:overflow-auto');
        }

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            backdrop.classList.remove('opacity-100');
            setTimeout(() => {
                backdrop.classList.add('hidden');
                document.body.classList.remove('overflow-hidden', 'md:overflow-auto');
            }, 300);
        }

        if (btnToggle) btnToggle.addEventListener('click', openSidebar);
        if (btnClose) btnClose.addEventListener('click', closeSidebar);
        if (backdrop) backdrop.addEventListener('click', closeSidebar);
    });
</script>
</body>
</html>
