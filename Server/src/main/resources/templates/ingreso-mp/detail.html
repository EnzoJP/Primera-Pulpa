<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/app-layout :: layout(~{::main})}">
<main>
    <div class="p-md lg:p-lg max-w-container-max mx-auto w-full flex flex-col gap-lg pb-3xl">

        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-md">
            <div>
                <h2 class="page-title">Detalle del Ingreso <span class="text-primary font-code-md" th:text="'#' + ${ingreso.id}">#1</span></h2>
                <p class="page-subtitle" th:text="'Registrado el ' + ${#temporals.format(ingreso.fechaHora, 'dd/MM/yyyy')} + ' a las ' + ${#temporals.format(ingreso.fechaHora, 'HH:mm')}">Fecha</p>
            </div>
            <a th:href="@{/ingresos-mp}" class="btn-secondary">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                Volver
            </a>
        </div>

        <div class="table-card">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead>
                        <tr class="table-header">
                            <th class="table-th">Materia Prima</th>
                            <th class="table-th text-right">Cantidad</th>
                            <th class="table-th text-right">Costo Unitario</th>
                            <th class="table-th text-right">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody class="font-body-md text-body-md text-on-surface">
                        <tr th:each="det : ${ingreso.detalles}" class="table-row">
                            <td class="table-td font-title-lg" th:text="${det.materiaPrima?.nombre}">MP</td>
                            <td class="table-td text-right font-code-md" th:text="${det.cantidad + ' ' + det.materiaPrima?.unidadMedida?.descripcion}">0 kg</td>
                            <td class="table-td text-right font-code-md text-primary" th:text="'$' + ${#numbers.formatDecimal(det.costoUnitario, 1, 2)}">$0.00</td>
                            <td class="table-td text-right font-code-md" th:text="'$' + ${#numbers.formatDecimal(det.cantidad * det.costoUnitario, 1, 2)}">$0.00</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(ingreso.detalles)}">
                            <td colspan="4" class="py-lg px-md text-center text-on-surface-variant font-body-md">Sin detalles.</td>
                        </tr>
                    </tbody>
                    <!-- Total -->
                    <tfoot>
                        <tr class="border-t-2 border-outline-variant bg-surface-container-low/50">
                            <td colspan="3" class="table-td text-right font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Total</td>
                            <td class="table-td text-right font-code-md font-bold text-on-surface"
                                th:text="'$' + ${#numbers.formatDecimal(ingreso.detalles.stream().mapToDouble(d -> d.cantidad * d.costoUnitario).sum(), 1, 2)}">$0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</main>
</html>
