<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Mixes</title>
</head>
<body>
<h1>Listado de Mixes</h1>
<p th:if="${success}" th:text="${success}"></p>
<p th:if="${error}" th:text="${error}"></p>
<p><a th:href="${basePath + '/nuevo'}">Nuevo mix</a></p>
<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio de venta</th>
        <th>Costo (por kg)</th>
        <th>Ganancia</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${items}">
        <td th:text="${item.id}">1</td>
        <td th:text="${item.nombre}">Mix</td>
        <td th:text="${item.precioVenta}">-</td>
        <td th:text="${item.costo}">0</td>
        <td th:if="${item.precioVenta != null}" th:text="${item.precioVenta - item.costo}">0</td>
        <td th:if="${item.precioVenta == null}">-</td>
        <td>
            <a th:href="${basePath + '/' + item.id}">Ver</a>
            <a th:href="${basePath + '/' + item.id + '/editar'}">Editar</a>
            <form th:action="${basePath + '/' + item.id + '/eliminar'}" method="post" style="display:inline;">
                <button type="submit">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
