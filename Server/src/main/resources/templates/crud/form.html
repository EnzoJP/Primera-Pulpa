<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: layout(${formTitle} + ' - Primera Pulpa', ${activeMenu ?: 'dashboard'}, ~{::#form-content})}">
<body>

<div id="form-content" class="max-w-3xl mx-auto space-y-md">

    <div class="pb-sm border-b border-outline-variant/20">
        <a th:href="@{|${basePath}|}"
           class="inline-flex items-center gap-xs font-label-caps text-label-caps text-on-surface-variant hover:text-primary mb-2 transition-colors">
            <span class="material-symbols-outlined text-[18px]">arrow_back</span>
            <span>Volver al listado</span>
        </a>
        <h1 class="font-headline-lg text-headline-lg text-primary tracking-tight" th:text="${formTitle}">
            Formulario
        </h1>
        <p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Complete los campos requeridos para continuar.</p>
    </div>

    <div th:if="${error}" class="flex items-center gap-xs p-base bg-error-container text-on-error-container rounded-lg border border-error/20 soft-shadow">
        <span class="material-symbols-outlined text-error fill">error</span>
        <span class="font-body-sm text-body-sm font-medium" th:text="${error}">Ocurrió un error al procesar el formulario.</span>
    </div>

    <div class="bg-surface-container-lowest rounded-xl soft-shadow border border-outline-variant/20 p-lg">
        <form th:object="${item}" th:action="${formAction}" method="post" class="space-y-md">

            <input type="hidden" th:if="*{id != null}" th:field="*{id}" />

            <div class="grid grid-cols-1 gap-md">
                <div th:each="field : ${formFields}" class="space-y-1.5">

                    <label th:for="${field.path}"
                           class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider"
                           th:text="${field.label}">
                        Campo
                    </label>

                    <input th:if="${field.inputType != 'checkbox' and field.inputType != 'textarea' and field.inputType != 'select'}"
                           th:type="${field.inputType}"
                           th:id="${field.path}"
                           th:field="*{__${field.path}__}"
                           class="w-full bg-surface border border-outline-variant/40 rounded-lg px-md py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline"
                           th:required="${field.required}" />

                    <textarea th:if="${field.inputType == 'textarea'}"
                              th:id="${field.path}"
                              th:field="*{__${field.path}__}"
                              rows="4"
                              class="w-full bg-surface border border-outline-variant/40 rounded-lg px-md py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all custom-scrollbar"
                              th:required="${field.required}"></textarea>

                    <div th:if="${field.inputType == 'checkbox'}" class="flex items-center gap-xs pt-1">
                        <input type="checkbox"
                               th:id="${field.path}"
                               th:field="*{__${field.path}__}"
                               class="rounded border-outline-variant/40 text-primary focus:ring-primary h-5 w-5 cursor-pointer" />
                        <span class="font-body-sm text-body-sm text-on-surface select-none" th:text="${field.helperText ?: 'Marcar como activo / habilitado'}"></span>
                    </div>

                    <select th:if="${field.inputType == 'select'}"
                            th:id="${field.path}"
                            th:field="*{__${field.path}__}"
                            class="w-full bg-surface border border-outline-variant/40 rounded-lg px-md py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                        <option value="">-- Seleccionar --</option>
                        <option th:each="opt : ${field.options}"
                                th:value="${opt.id}"
                                th:text="${opt.nombre ?: opt.descripcion}">Opción</option>
                    </select>

                    <p th:if="${#fields.hasErrors(field.path)}"
                       th:errors="*{__${field.path}__}"
                       class="text-error font-body-sm text-xs mt-1 flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">error</span>
                        <span>Error de validación</span>
                    </p>
                </div>
            </div>

            <div class="flex items-center justify-end gap-sm pt-md border-t border-outline-variant/20">
                <a th:href="@{|${basePath}|}"
                   class="px-md py-2.5 text-on-surface-variant font-label-caps text-label-caps hover:bg-surface-container rounded-lg transition-colors">
                    Cancelar
                </a>
                <button type="submit"
                        class="inline-flex items-center gap-xs px-md py-2.5 bg-primary text-on-primary font-label-caps text-label-caps rounded-lg soft-shadow hover:opacity-90 transition-opacity">
                    <span class="material-symbols-outlined text-[18px]">save</span>
                    <span>Guardar Registro</span>
                </button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
