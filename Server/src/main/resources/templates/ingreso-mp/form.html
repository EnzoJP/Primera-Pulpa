<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: layout('Nuevo Ingreso de Materia Prima - Primera Pulpa', 'ingresos-mp', ~{::#ingreso-form-content})}">
<body>

<div id="ingreso-form-content" class="space-y-md">

    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-base pb-sm border-b border-outline-variant/20">
        <div>
            <div class="flex items-center gap-xs text-on-surface-variant font-label-caps text-label-caps uppercase mb-1">
                <span class="material-symbols-outlined text-[18px]">move_to_inbox</span>
                <span>Registro de Stock</span>
            </div>
            <h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Nuevo Ingreso de Materia Prima</h1>
            <p class="font-body-sm text-body-sm text-on-surface-variant">Registrá los insumos recibidos</p>
        </div>

        <a th:href="@{/ingresos-mp}"
           class="inline-flex items-center justify-center gap-xs px-md py-sm bg-surface-container text-on-surface font-label-caps text-label-caps rounded-lg hover:bg-surface-container-highest transition-colors">
            <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            <span>Volver al Listado</span>
        </a>
    </header>

    <!-- Error alert -->
    <div th:if="${error}" class="flex items-center gap-xs p-base bg-error-container text-on-error-container rounded-lg border border-error/20 soft-shadow">
        <span class="material-symbols-outlined text-error fill">error</span>
        <span class="font-body-sm text-body-sm font-medium" th:text="${error}">Ha ocurrido un error.</span>
    </div>

    <!-- Formulario -->
    <form th:action="@{/ingresos-mp/confirmar}" method="post" class="space-y-md">

        <div class="bg-surface-container-lowest rounded-xl soft-shadow border border-outline-variant/20 overflow-hidden">
            <div class="p-md border-b border-outline-variant/20 bg-surface-container-low flex justify-between items-center">
                <h3 class="font-headline-md text-headline-md text-primary">Insumos a Ingresar</h3>
                <span class="font-body-sm text-body-sm text-on-surface-variant">Agregá una o más materias primas</span>
            </div>

            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left border-collapse" id="tablaDetalles">
                    <thead class="bg-surface-container border-b border-outline-variant/20 text-on-surface-variant font-label-caps text-label-caps">
                    <tr>
                        <th class="py-3 px-4 font-normal w-auto">Materia Prima</th>
                        <th class="py-3 px-4 font-normal w-52 text-right">Cantidad</th>
                        <th class="py-3 px-4 font-normal w-20 text-center"></th>
                    </tr>
                    </thead>
                    <tbody id="filas" class="font-body-sm text-body-sm text-on-surface divide-y divide-outline-variant/10">
                        <tr class="hover:bg-surface-container-low transition-colors" id="fila-0">
                            <td class="py-3 px-4">
                                <select name="materiaPrimaId" required onchange="onMateriaPrimaChange(this)"
                                        class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant/50 rounded-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-sm text-body-sm">
                                    <option value="">Seleccione materia prima...</option>
                                    <option th:each="mp : ${materiaPrimas}"
                                            th:value="${mp.id}"
                                            th:text="${mp.nombre}">MP</option>
                                </select>
                            </td>
                            <td class="py-3 px-4">
                                <input type="number" name="cantidad" min="0.0" step="1.0" required placeholder="0.000"
                                       class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant/50 rounded-lg text-on-surface text-right font-data-tabular text-data-tabular focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary"/>
                            </td>
                            <td class="py-3 px-4 text-center">
                                <button type="button" onclick="quitarFila(this)" title="Quitar fila"
                                        class="p-1.5 text-on-surface-variant hover:text-error hover:bg-error-container/30 rounded-lg transition-colors opacity-0 pointer-events-none">
                                    <span class="material-symbols-outlined text-[20px]">remove_circle</span>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Botón agregar fila -->
            <div class="p-md border-t border-outline-variant/20 bg-surface-container-low/50">
                <button type="button" onclick="agregarFila()"
                        class="inline-flex items-center gap-xs px-md py-2 bg-surface-container text-primary font-label-caps text-label-caps rounded-lg hover:bg-surface-container-highest transition-colors border border-outline-variant/30">
                    <span class="material-symbols-outlined text-[18px]">add_circle</span>
                    <span>Agregar otra materia prima</span>
                </button>
            </div>
        </div>

        <!-- Botones de Acción -->
        <div class="flex items-center justify-end gap-sm pt-sm">
            <a th:href="@{/ingresos-mp}"
               class="px-md py-sm bg-surface-container text-on-surface font-label-caps text-label-caps rounded-lg hover:bg-surface-container-highest transition-colors">
                Cancelar
            </a>
            <button type="submit"
                    class="inline-flex items-center gap-xs px-lg py-sm bg-primary text-on-primary font-label-caps text-label-caps rounded-lg soft-shadow hover:opacity-90 transition-opacity">
                <span class="material-symbols-outlined text-[20px]">check_circle</span>
                <span>Confirmar Ingreso</span>
            </button>
        </div>
    </form>

    <script th:inline="javascript">
        const materiaPrimas = /*[[${materiaPrimas}]]*/ [];
        let contadorFilas = 0;

        function buildSelect() {
            let opts = '<option value="">Seleccione materia prima...</option>';
            materiaPrimas.forEach(mp => {
                const unidad = mp.unidadMedida ? mp.unidadMedida.descripcion : 'kg';
                opts += `<option value="${mp.id}">${mp.nombre} (${unidad})</option>`;
            });
            return opts;
        }

        function onMateriaPrimaChange(selectElem) {
            const row = selectElem.closest('tr');
            const cantidadInput = row.querySelector('input[name="cantidad"]');
            const costoInput = row.querySelector('input[name="costoUnitario"]');
            const selectedId = selectElem.value;

            if (!selectedId) {
                cantidadInput.min = "1.00";
                cantidadInput.placeholder = "0.00";
                costoInput.placeholder = "0.00";
                return;
            }

            const mp = materiaPrimas.find(item => item.id == selectedId);

        }

        function agregarFila() {
            contadorFilas++;
            const tbody = document.getElementById('filas');
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-surface-container-low transition-colors';
            tr.id = `fila-${contadorFilas}`;
            tr.innerHTML = `
                <td class="py-3 px-4">
                    <select name="materiaPrimaId" required onchange="onMateriaPrimaChange(this)"
                            class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant/50 rounded-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-sm text-body-sm">
                        ${buildSelect()}
                    </select>
                </td>
                <td class="py-3 px-4">
                    <input type="number" name="cantidad" min="0.00" step="1.00" required placeholder="0.00"
                           class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant/50 rounded-lg text-on-surface text-right font-data-tabular text-data-tabular focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary"/>
                </td>
                <td class="py-3 px-4 text-center">
                    <button type="button" onclick="quitarFila(this)" title="Quitar fila"
                            class="p-1.5 text-on-surface-variant hover:text-error hover:bg-error-container/30 rounded-lg transition-colors">
                        <span class="material-symbols-outlined text-[20px]">remove_circle</span>
                    </button>
                </td>`;
            tbody.appendChild(tr);
            actualizarBotonesQuitar();
        }

        function quitarFila(btn) {
            const tr = btn.closest('tr');
            if (document.querySelectorAll('#filas tr').length > 1) {
                tr.remove();
                actualizarBotonesQuitar();
            }
        }

        function actualizarBotonesQuitar() {
            const filas = document.querySelectorAll('#filas tr');
            filas.forEach(fila => {
                const btn = fila.querySelector('button[title="Quitar fila"]');
                if (btn) {
                    if (filas.length === 1) {
                        btn.classList.add('opacity-0', 'pointer-events-none');
                    } else {
                        btn.classList.remove('opacity-0', 'pointer-events-none');
                    }
                }
            });
        }
    </script>
</div>

</body>
</html>
