<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Fórmula</title>
</head>
<body>
<h1>Detalle de Fórmula</h1>
<table border="1" cellpadding="6">
    <tr><th>ID</th><td th:text="${item.id}">1</td></tr>
    <tr><th>Mix</th><td th:text="${item.mix?.nombre}">Mix</td></tr>
    <tr><th>Cantidad que produce (kg)</th><td th:text="${item.cantidad}">0</td></tr>
</table>
<h2>Materias primas</h2>
<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>Materia prima</th>
        <th>Gramos</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="d : ${item.detalles}">
        <td th:text="${d.materiaPrima?.nombre}">Materia prima</td>
        <td th:text="${d.gramos}">0</td>
    </tr>
    </tbody>
</table>
<p>
    <a th:href="${basePath + '/' + item.id + '/editar'}">Editar</a>
    <a th:href="${basePath}">Volver</a>
</p>
</body>
</html>
