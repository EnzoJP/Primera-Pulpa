<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Formulario</title>
</head>
<body>
<h1 th:text="${formTitle}">Formulario</h1>
<p th:if="${error}" th:text="${error}"></p>
<form th:object="${item}" th:action="${formAction}" method="post">
    <div>
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" th:field="*{nombre}" required>
    </div>
    <div>
        <label for="unidadMedida">Unidad de medida</label>
        <select id="unidadMedida" name="unidadMedida" required>
            <option value="">Seleccionar...</option>
            <option th:each="u : ${unidades}" th:value="${u.id}"
                    th:selected="${item.unidadMedida != null and item.unidadMedida.id == u.id}"
                    th:text="${u.descripcion}">Unidad</option>
        </select>
    </div>
    <div>
        <label for="precio">Precio</label>
        <input id="precio" type="number" step="0.01" min="0" th:field="*{precio}" required>
    </div>
    <div>
        <label for="cantidadMinima">Stock mínimo</label>
        <input id="cantidadMinima" type="number" step="0.01" min="0" th:field="*{cantidadMinima}" required>
    </div>
    <button type="submit">Guardar</button>
</form>
<p><a th:href="${basePath}">Volver</a></p>
</body>
</html>
