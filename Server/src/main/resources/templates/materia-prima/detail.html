<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Detalle de ' + ${item.nombre}">Detalle</title>
</head>
<body>
<h1 th:text="'Detalle de ' + ${item.nombre}">Detalle</h1>
<table border="1" cellpadding="6">
    <tr><th>ID</th><td th:text="${item.id}">1</td></tr>
    <tr><th>Nombre</th><td th:text="${item.nombre}">Nombre</td></tr>
    <tr><th>Unidad de medida</th><td th:text="${item.unidadMedida?.descripcion}">kg</td></tr>
    <tr><th>Precio</th><td th:text="${item.precio}">0</td></tr>
    <tr><th>Stock actual</th><td th:text="${item.cantidadActual}">0</td></tr>
    <tr><th>Stock mínimo</th><td th:text="${item.cantidadMinima}">0</td></tr>
    <tr><th>Fecha de ingreso</th><td th:text="${item.fechaIngreso}">2026-01-01</td></tr>
</table>
<p>
    <a th:href="${basePath + '/' + item.id + '/editar'}">Editar</a>
    <a th:href="${basePath}">Volver</a>
</p>
</body>
</html>
