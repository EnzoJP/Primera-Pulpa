<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: layout('Mi Perfil - Primera Pulpa', 'perfil', ~{::#perfil-content})}">
<body>

<div id="perfil-content" class="space-y-md">

    <!-- Header -->
    <header class="pb-sm border-b border-outline-variant/20">
        <div class="flex items-center gap-xs text-on-surface-variant font-label-caps text-label-caps uppercase mb-1">
            <span class="material-symbols-outlined text-[18px]">account_circle</span>
            <span>Cuenta de Usuario</span>
        </div>
        <h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Mi Perfil</h1>
        <p class="font-body-sm text-body-sm text-on-surface-variant">Información personal y credenciales de acceso al ERP.</p>
    </header>

    <!-- Layout Perfil -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-md">
        <!-- Columna Izquierda: Tarjeta de Presentación -->
        <div class="bg-surface-container-lowest rounded-xl soft-shadow border border-outline-variant/20 p-lg flex flex-col items-center text-center">
            <div class="w-28 h-28 rounded-full border-4 border-surface-container-high flex items-center justify-center bg-primary-container text-on-primary-container text-display font-bold mb-md"
                 th:text="${usuario != null and usuario.nombre != null ? #strings.substring(usuario.nombre, 0, 2).toUpperCase() : 'US'}">
                US
            </div>

            <h2 class="font-headline-md text-headline-md text-primary mb-1" th:text="${usuario != null ? usuario.nombre : 'Usuario Actual'}">Usuario Actual</h2>
            <div class="inline-flex items-center gap-1 px-3 py-1 bg-surface-container text-on-surface-variant rounded-full text-xs font-semibold font-label-caps mb-lg">
                <span class="material-symbols-outlined text-[15px]">verified_user</span>
                <span th:text="${usuario != null and usuario.rol != null ? usuario.rol.descripcion : 'ROL'}">ADMIN</span>
            </div>

            <div class="w-full border-t border-outline-variant/20 pt-md space-y-sm text-left">
                <div class="flex items-center gap-2 text-on-surface-variant">
                    <span class="material-symbols-outlined text-[20px] text-outline">mail</span>
                    <span class="font-body-sm text-body-sm truncate" th:text="${usuario != null ? usuario.email : 'usuario@primerapulpa.com'}">usuario@primerapulpa.com</span>
                </div>
                <div class="flex items-center gap-2 text-on-surface-variant">
                    <span class="material-symbols-outlined text-[20px] text-outline">badge</span>
                    <span class="font-body-sm text-body-sm font-data-tabular" th:text="${usuario != null ? 'ID: #' + usuario.id : 'ID: #1'}">ID: #1</span>
                </div>
            </div>
        </div>

        <!-- Columna Derecha: Datos Generales -->
        <div class="lg:col-span-2 bg-surface-container-lowest rounded-xl soft-shadow border border-outline-variant/20 p-lg">
            <h3 class="font-headline-md text-headline-md text-primary mb-md">Datos de la Cuenta</h3>

            <div class="space-y-md">
                <div class="space-y-1.5">
                    <label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Nombre Completo</label>
                    <input type="text" th:value="${usuario != null ? usuario.nombre : 'Usuario'}" disabled
                           class="w-full px-md py-2.5 bg-surface-container-low border border-outline-variant/40 rounded-lg font-body-md text-body-md text-on-surface-variant cursor-not-allowed"/>
                </div>

                <div class="space-y-1.5">
                    <label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Correo Electrónico</label>
                    <input type="email" th:value="${usuario != null ? usuario.email : 'usuario@primerapulpa.com'}" disabled
                           class="w-full px-md py-2.5 bg-surface-container-low border border-outline-variant/40 rounded-lg font-body-md text-body-md text-on-surface-variant cursor-not-allowed"/>
                </div>

                <div class="space-y-1.5">
                    <label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Rol de Permisos</label>
                    <input type="text" th:value="${usuario != null and usuario.rol != null ? usuario.rol.descripcion : 'SIN ROL'}" disabled
                           class="w-full px-md py-2.5 bg-surface-container-low border border-outline-variant/40 rounded-lg font-body-md text-body-md text-on-surface-variant cursor-not-allowed"/>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
